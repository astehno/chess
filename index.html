<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CHESS-PT Workflow Canvas</title>
  <style>
    :root {
      --tier-1-color: #e3f2fd;
      --tier-2-color: #e0f2f1;
      --tier-3-color: #fff3e0;
      --tier-4-color: #f3e5f5;
      --tier-5-color: #f3e5f5;
      --tier-6-color: #e8f5e9;
    }
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .btn { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background-color: #0056b3; }
    
    /* Validation & Warning Alerts */
    .alert-container { margin: 15px 0; }
    .alert-box { padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; font-size: 0.9em; }
    .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

    /* Canvas Grid and Cell Styling */
    .canvas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    .tier-column { background: white; border: 1px solid #ccc; border-radius: 6px; padding: 12px; }
    .item-tile {
      padding: 8px 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 4px;
      cursor: pointer; user-select: none; transition: all 0.2s ease;
    }
    
    /* State Modifiers */
    .item-tile.selected { border: 2px solid #0056b3; font-weight: bold; }
    .item-tile.dashed-border { border-style: dashed; border-color: #333; }
    .item-tile.highlighted-cell { background-color: #fff59d !important; }
    .item-tile.grayed-out-cell { opacity: 0.35; background-color: #e0e0e0 !important; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="header-bar">
  <h2>CHESS-PT Interactive Workflow Builder</h2>
  <button class="btn" onclick="navigateToSummary()">Open Summary & Wiki</button>
</div>

<!-- Dynamic Errors and Warnings Output -->
<div id="statusAlertContainer" class="alert-container"></div>

<!-- Interactive Canvas Grid -->
<div class="canvas-grid" id="canvasItems"></div>

<!-- 1. LOAD THE SHARED CORE FILE FIRST -->
<script src="chess_pt_core.js"></script>

<!-- 2. PAGE EVENT LOGIC -->
<script>
// Retrieve active selections directly from the core engine storage
let activeSelections = loadWorkflowState();

function navigateToSummary() {
  saveWorkflowState(activeSelections);
  window.location.href = "chess_pt_summary_view.html";
}

function toggleSelection(itemId, isGrayed) {
  if (isGrayed) return; // Prevent selection if disabled by dependency rules
  
  if (activeSelections.has(itemId)) {
    activeSelections.delete(itemId);
  } else {
    activeSelections.add(itemId);
  }
  
  // Persist updated selection to localStorage via core engine
  saveWorkflowState(activeSelections);
  renderCanvas();
}

function renderStatusAlerts() {
  const alertContainer = document.getElementById('statusAlertContainer');
  alertContainer.innerHTML = '';

  // Get active errors/warnings from core validation engine
  const issues = evaluateWorkflowStatus(activeSelections);

  issues.forEach(issue => {
    const box = document.createElement('div');
    box.className = `alert-box alert-${issue.type}`;
    box.innerHTML = `<strong>[${issue.type.toUpperCase()}]</strong> ${issue.message}`;
    alertContainer.appendChild(box);
  });
}

function renderCanvas() {
  const container = document.getElementById('canvasItems');
  container.innerHTML = '';

  // Compute disabled items on demand using core engine
  const grayedOutSet = calculateGrayedOutIds(activeSelections);
  
  // Render alert boxes
  renderStatusAlerts();

  // Render schema options from core engine
  CHESS_WORKFLOW_SCHEMA.forEach(tier => {
    const col = document.createElement('div');
    col.className = 'tier-column';
    
    const title = document.createElement('h3');
    title.innerText = tier.name;
    col.appendChild(title);

    tier.subs.forEach(item => {
      const tile = document.createElement('div');
      const isGrayed = grayedOutSet.has(item.id);
      const isSelected = activeSelections.has(item.id);

      let classList = ['item-tile'];
      if (item.dashed) classList.push('dashed-border');
      if (item.highlight) classList.push('highlighted-cell');
      if (isSelected) classList.push('selected');
      if (isGrayed) classList.push('grayed-out-cell');

      tile.className = classList.join(' ');
      tile.innerText = `${item.id} ${item.name}`;

      if (!isGrayed) {
        tile.style.backgroundColor = isSelected ? '#bbdefb' : tier.colorVar;
      }

      tile.onclick = () => toggleSelection(item.id, isGrayed);
      col.appendChild(tile);
    });

    container.appendChild(col);
  });
}

// Render canvas grid when DOM loads
document.addEventListener("DOMContentLoaded", renderCanvas);
</script>
</body>
</html>
