<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CHESS-PT Step Summary & Wiki</title>
  <style>
    :root {
      --tier-1-color: #e3f2fd;
      --tier-2-color: #e0f2f1;
      --tier-3-color: #fff3e0;
      --tier-4-color: #f3e5f5;
      --tier-5-color: #f3e5f5;
      --tier-6-color: #e8f5e9;
    }
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    .logo-header { font-size: 1.4em; font-weight: bold; }
    .btn { padding: 8px 16px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background-color: #5a6268; }

    /* Warnings and Error Notification Styling */
    .alert-container { margin: 15px 0; }
    .alert-box { padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; font-size: 0.9em; }
    .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

    /* Summary Grid Structure */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 20px; }
    .summary-tier-group { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
    
    /* Summary Tile Classes */
    .summary-tile {
      padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px;
      font-size: 0.9em; cursor: pointer; transition: transform 0.1s ease;
    }
    .summary-tile:hover { transform: translateY(-1px); }
    .summary-tile.dashed-border { border-style: dashed; border-color: #000; border-width: 1.5px; }
    .summary-tile.highlighted-cell { background-color: #fff59d !important; font-weight: bold; }
    .summary-tile.grayed-out-cell { opacity: 0.35; background-color: #e0e0e0 !important; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="header-bar">
  <span class="logo-header">CHESS-PT Step Summary & Wiki</span>
  <button class="btn" onclick="navigateBack()">Back to Workflow Canvas</button>
</div>

<p><small>View all available steps and data types. Color-coded by Tier. Black dashed outlines indicate specific data. Click colored cells to navigate to their associated Coastal Wiki pages.</small></p>

<!-- Dynamic Validation Messages Container -->
<div id="statusAlertContainer" class="alert-container"></div>

<div class="summary-grid" id="summaryItems"></div>

<script src="chess_pt_core.js"></script>
<script>
let activeSelections = loadWorkflowState();

function navigateBack() {
  window.history.back();
}

function renderStatusAlerts(grayedOutSet) {
  const alertContainer = document.getElementById('statusAlertContainer');
  alertContainer.innerHTML = '';

  const issues = evaluateWorkflowStatus(activeSelections);

  issues.forEach(issue => {
    const box = document.createElement('div');
    box.className = `alert-box alert-${issue.type}`;
    box.innerHTML = `<strong>[${issue.type.toUpperCase()}]</strong> ${issue.message}`;
    alertContainer.appendChild(box);
  });
}

function createSummaryTile(item, colorVar, grayedOutSet) {
  const tile = document.createElement('div');
  const isGrayed = grayedOutSet.has(item.id);
  
  let classList = ['summary-tile'];
  if (item.dashed) classList.push('dashed-border');
  if (item.highlight) classList.push('highlighted-cell');
  
  if (isGrayed) {
    classList.push('grayed-out-cell');
  } else {
    tile.style.backgroundColor = colorVar;
  }

  tile.className = classList.join(' ');
  tile.innerText = `${item.id} ${item.name}`;

  // Wiki click routing
  tile.onclick = () => {
    if (!isGrayed && CHESS_WIKI_MAP[item.id]) {
      window.open(CHESS_WIKI_MAP[item.id], '_blank');
    }
  };

  return tile;
}

function renderStepSummary() {
  const container = document.getElementById('summaryItems');
  container.innerHTML = '';

  const grayedOutSet = calculateGrayedOutIds(activeSelections);
  renderStatusAlerts(grayedOutSet);

  CHESS_WORKFLOW_SCHEMA.forEach(tier => {
    const tierGroup = document.createElement('div');
    tierGroup.className = 'summary-tier-group';
    
    const header = document.createElement('h3');
    header.innerText = tier.name;
    tierGroup.appendChild(header);

    tier.subs.forEach(item => {
      const tile = createSummaryTile(item, tier.colorVar, grayedOutSet);
      tierGroup.appendChild(tile);
    });

    container.appendChild(tierGroup);
  });
}

document.addEventListener("DOMContentLoaded", renderStepSummary);
</script>
</body>
</html>
